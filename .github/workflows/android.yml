# Compila la app de Android "Bodega Komatsu".
# Se ejecuta a mano desde la pestaña Actions (botón "Run workflow") o cuando cambia la carpeta android/.
# Resultado (en "Artifacts" de cada ejecución):
#   - bodega-komatsu-apk: APK para instalar y probar en un celular.
#   - bodega-komatsu-aab: paquete .aab firmado para subir a Google Play (si están cargados los secretos de firma).
name: App Android

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Dominio de la tienda (sin https://). Vacío = el de android/gradle.properties'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma (si hay secretos)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/komatsu-upload.jks"
            echo "KOMATSU_KEYSTORE_FILE=$RUNNER_TEMP/komatsu-upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin secretos de firma: se genera sólo el APK de prueba. Ver android/README.md"
          fi

      - name: Compilar
        env:
          KOMATSU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KOMATSU_KEY_ALIAS: komatsu
          HOST_INPUT: ${{ github.event.inputs.host }}
        run: |
          chmod +x gradlew
          HOST_ARG=""
          if [ -n "$HOST_INPUT" ]; then HOST_ARG="-PkomatsuHost=$HOST_INPUT"; fi
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon $HOST_ARG assembleRelease bundleRelease
          else
            ./gradlew --no-daemon $HOST_ARG assembleDebug
          fi

      - name: Huella de la firma (para assetlinks)
        run: |
          {
            echo "## Bodega Komatsu"
            if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
              echo "Firma de subida (upload key) — SHA-256:"
              echo '```'
              keytool -list -v -keystore "$KOMATSU_KEYSTORE_FILE" -storepass "$KOMATSU_KEYSTORE_PASSWORD" -alias komatsu | grep 'SHA256:' | sed 's/.*SHA256: //'
              echo '```'
            else
              echo "APK de prueba firmado con la llave de depuración — SHA-256:"
              echo '```'
              keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | sed 's/.*SHA256: //'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          KOMATSU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: bodega-komatsu-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: bodega-komatsu-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
