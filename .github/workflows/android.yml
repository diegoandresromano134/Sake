# Compila la app de Android "Bodega Komatsu".
# Se ejecuta a mano desde la pestaña Actions (botón "Run workflow") o cuando cambia la app.
# Resultados:
#   - APK DEMO para instalar en el celular, publicado en Releases ("demo"):
#       https://github.com/<usuario>/<repo>/releases/download/demo/bodega-komatsu-demo.apk
#   - bodega-komatsu-apk (Artifacts): APKs de prueba.
#   - bodega-komatsu-aab (Artifacts): paquete .aab firmado para Google Play (si están los secretos de firma).
name: App Android

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Dominio de la tienda (sin https://). Vacío = el de android/gradle.properties'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['android/**', 'public/**', 'demo/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Empaquetar la demo dentro de la app
        run: |
          npm ci
          node demo/build.mjs android/app/src/demo/assets/demo --standalone

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma (si hay secretos)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/komatsu-upload.jks"
            echo "KOMATSU_KEYSTORE_FILE=$RUNNER_TEMP/komatsu-upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin secretos de firma: se generan sólo APKs de prueba. Ver android/README.md"
          fi

      - name: Compilar
        working-directory: android
        env:
          KOMATSU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KOMATSU_KEY_ALIAS: komatsu
          HOST_INPUT: ${{ github.event.inputs.host }}
        run: |
          chmod +x gradlew
          HOST_ARG=""
          if [ -n "$HOST_INPUT" ]; then HOST_ARG="-PkomatsuHost=$HOST_INPUT"; fi
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            TASKS="assembleTiendaRelease bundleTiendaRelease assembleDemoRelease"
          else
            TASKS="assembleTiendaDebug assembleDemoDebug"
          fi
          # Reintenta si el repositorio de descargas responde con errores pasajeros (429/5xx).
          for i in 1 2 3; do
            ./gradlew --no-daemon $HOST_ARG $TASKS && exit 0
            echo "::warning::Intento $i falló; reintento en $((i*30)) s"; sleep $((i*30))
          done
          exit 1

      - name: Publicar el APK demo (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/demo/*/*.apk | head -1)
          cp "$APK" bodega-komatsu-demo.apk
          gh release view demo >/dev/null 2>&1 || gh release create demo --title "Bodega Komatsu — demo para Android" \
            --notes "App de prueba con la tienda adentro (funciona sin servidor). Descargá bodega-komatsu-demo.apk desde el celular e instalalo." --prerelease
          gh release upload demo bodega-komatsu-demo.apk --clobber
          {
            echo "## Bodega Komatsu"
            echo "APK demo: https://github.com/${{ github.repository }}/releases/download/demo/bodega-komatsu-demo.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Huella de la firma (para assetlinks)
        env:
          KOMATSU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          {
            if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
              echo "Firma de subida (upload key) — SHA-256:"
              echo '```'
              keytool -list -v -keystore "$KOMATSU_KEYSTORE_FILE" -storepass "$KOMATSU_KEYSTORE_PASSWORD" -alias komatsu | grep 'SHA256:' | sed 's/.*SHA256: //'
              echo '```'
            else
              echo "APKs de prueba firmados con la llave de depuración — SHA-256:"
              echo '```'
              keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | sed 's/.*SHA256: //'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bodega-komatsu-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: bodega-komatsu-aab
          path: android/app/build/outputs/bundle/tiendaRelease/*.aab
          if-no-files-found: error
